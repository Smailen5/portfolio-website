<!doctype html>
<html lang="it" data-theme="nebula">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Manifest PWA -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph statici: i crawler social leggono solo questo HTML (non eseguono JS)
     Tenere i valori identici a OPEN_GRAPH_TAGS in src/shared/constants/metaTags.ts,
     applicati a runtime da TanStack Router -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:site_name" content="Smailen Vargas Portfolio" />
    <meta property="og:title" content="Smailen Vargas | Frontend Developer" />
    <meta
      property="og:description"
      content="Ciao, sono Smailen Vargas, Frontend Developer specializzato in React, TypeScript e Tailwind CSS"
    />
    <meta property="og:url" content="https://smailenvargas.com" />
    <meta
      property="og:image"
      content="https://smailenvargas.com/images/immagine-sito.jpeg"
    />
    <meta property="og:image:width" content="1515" />
    <meta property="og:image:height" content="826" />
    <meta
      property="og:image:alt"
      content="Anteprima del portfolio di Smailen Vargas, Frontend Developer"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
